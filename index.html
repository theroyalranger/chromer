<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Royal Chromer</title>
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    /* Fullscreen Fluid Water Canvas */
    #waterCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
      width: 100%;
      max-width: 700px;
      padding: 20px;
    }

    h1 {
      font-size: 3.2rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    /* Search Bar Form */
    .search-form {
      width: 100%;
      max-width: 550px;
      margin-bottom: 2.5rem;
      position: relative;
    }

    .search-input-wrapper {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50px;
      padding: 8px 16px 8px 22px;
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .search-input-wrapper:focus-within {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.4);
      transform: translateY(-2px);
    }

    .search-icon {
      color: #9ca3af;
      font-size: 1.1rem;
      margin-right: 12px;
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 500;
    }

    .search-input::placeholder {
      color: #6b7280;
    }

    .search-button {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #ffffff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-left: 8px;
    }

    .search-button:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    /* Shortcut Grid */
    .links-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 22px;
      max-width: 650px;
    }

    /* Circular Pill Buttons */
    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 90px;
      height: 90px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      text-decoration: none;
      border-radius: 50%;
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .btn i {
      font-size: 1.6rem;
      margin-bottom: 6px;
      transition: transform 0.3s ease;
    }

    .btn span {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      opacity: 0.85;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-6px) scale(1.05);
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
    }

    .btn:hover i {
      transform: scale(1.15);
    }

    /* Individual Accent Colors on Hover */
    .btn.youtube:hover { border-color: #ff0000; box-shadow: 0 8px 25px rgba(255, 0, 0, 0.35); }
    .btn.aternos:hover { border-color: #2b70c9; box-shadow: 0 8px 25px rgba(43, 112, 201, 0.35); }
    .btn.chunkbase:hover { border-color: #10b981; box-shadow: 0 8px 25px rgba(16, 185, 129, 0.35); }
    .btn.chat:hover { border-color: #00ac47; box-shadow: 0 8px 25px rgba(0, 172, 71, 0.35); }
    .btn.meet:hover { border-color: #00832d; box-shadow: 0 8px 25px rgba(0, 131, 45, 0.35); }
  </style>
</head>
<body>
  <!-- Canvas background for liquid simulation -->
  <canvas id="waterCanvas"></canvas>

  <div class="container">
    <h1>The Royal Chromer</h1>

    <!-- Search Bar -->
    <form class="search-form" action="https://www.google.com/search" method="GET">
      <div class="search-input-wrapper">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" name="q" class="search-input" placeholder="Search Google or type a URL..." autofocus autocomplete="off">
        <button type="submit" class="search-button" aria-label="Search">
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </form>

    <!-- Circular Shortcut Buttons -->
    <div class="links-grid">
      <a class="btn youtube" href="https://youtube.com" target="_blank" title="YouTube">
        <i class="fa-brands fa-youtube" style="color: #ff4e4e;"></i>
        <span>YouTube</span>
      </a>

      <a class="btn aternos" href="https://aternos.org" target="_blank" title="Aternos">
        <i class="fa-solid fa-server" style="color: #60a5fa;"></i>
        <span>Aternos</span>
      </a>

      <a class="btn chunkbase" href="https://chunkbase.com" target="_blank" title="Chunkbase">
        <i class="fa-solid fa-cubes" style="color: #34d399;"></i>
        <span>Chunkbase</span>
      </a>

      <a class="btn chat" href="https://chat.google.com" target="_blank" title="Google Chat">
        <i class="fa-solid fa-comment-dots" style="color: #4ade80;"></i>
        <span>Chat</span>
      </a>

      <a class="btn meet" href="https://meet.google.com" target="_blank" title="Google Meet">
        <i class="fa-solid fa-video" style="color: #2dd4bf;"></i>
        <span>Meet</span>
      </a>
    </div>
  </div>

  <script>
    // Colored Water Physics Simulation
    const canvas = document.getElementById('waterCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const mouse = { x: -1000, y: -1000, vx: 0, vy: 0, px: -1000, py: -1000, active: false };

    window.addEventListener('mousemove', (e) => {
      mouse.active = true;
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.vx = (mouse.x - mouse.px) * 0.3;
      mouse.vy = (mouse.y - mouse.py) * 0.3;
      mouse.px = mouse.x;
      mouse.py = mouse.y;

      // Spawn liquid dye particles when cursor moves
      const speed = Math.hypot(mouse.vx, mouse.vy);
      const count = Math.min(Math.floor(speed * 1.5) + 2, 8);
      for (let i = 0; i < count; i++) {
        particles.push(createLiquidParticle(mouse.x, mouse.y, mouse.vx, mouse.vy));
      }
    });

    window.addEventListener('mouseleave', () => {
      mouse.active = false;
    });

    // Color palettes for liquid ink
    const colorPalette = [
      { r: 0, g: 162, b: 255 },   // Electric Cyan
      { r: 99, g: 102, b: 241 },  // Deep Indigo
      { r: 168, g: 85, b: 247 },  // Neon Violet
      { r: 16, g: 185, b: 129 }   // Emerald Blue
    ];

    let colorIndex = 0;
    const particles = [];

    function createLiquidParticle(x, y, vx, vy) {
      colorIndex = (colorIndex + 0.1) % colorPalette.length;
      const c1 = colorPalette[Math.floor(colorIndex)];
      const c2 = colorPalette[(Math.floor(colorIndex) + 1) % colorPalette.length];
      const factor = colorIndex % 1;

      // Blend fluid colors smoothly
      const r = Math.round(c1.r + (c2.r - c1.r) * factor);
      const g = Math.round(c1.g + (c2.g - c1.g) * factor);
      const b = Math.round(c1.b + (c2.b - c1.b) * factor);

      const angle = Math.random() * Math.PI * 2;
      const spread = Math.random() * 2 + 0.5;

      return {
        x: x + (Math.random() - 0.5) * 20,
        y: y + (Math.random() - 0.5) * 20,
        vx: vx * 0.4 + Math.cos(angle) * spread,
        vy: vy * 0.4 + Math.sin(angle) * spread,
        radius: Math.random() * 30 + 20,
        maxRadius: Math.random() * 80 + 50,
        life: 1,
        decay: Math.random() * 0.02 + 0.025, // Accelerated decay to fade out in ~1 second (at 60fps)
        r, g, b,
        swirl: (Math.random() - 0.5) * 0.04
      };
    }

    function animate() {
      // Faster trail clearing so water drops vanish swiftly
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.fillRect(0, 0, width, height);

      // Dampen mouse velocity vector
      mouse.vx *= 0.9;
      mouse.vy *= 0.9;

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        // Liquid turbulence physics
        p.x += p.vx;
        p.y += p.vy;

        // Swirl current effect
        const tempVx = p.vx;
        p.vx = p.vx * Math.cos(p.swirl) - p.vy * Math.sin(p.swirl);
        p.vy = tempVx * Math.sin(p.swirl) + p.vy * Math.cos(p.swirl);

        // Friction / Fluid resistance
        p.vx *= 0.94;
        p.vy *= 0.94;

        // Expand as water diffuses ink
        if (p.radius < p.maxRadius) {
          p.radius += 0.6;
        }

        p.life -= p.decay;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        // Render soft liquid watercolor drop
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        
        const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
        const alpha = p.life * 0.5;
        
        gradient.addColorStop(0, `rgba(${p.r}, ${p.g}, ${p.b}, ${alpha})`);
        gradient.addColorStop(0.5, `rgba(${p.r}, ${p.g}, ${p.b}, ${alpha * 0.3})`);
        gradient.addColorStop(1, `rgba(${p.r}, ${p.g}, ${p.b}, 0)`);

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
