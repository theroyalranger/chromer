<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Royal Chromer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #06090e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .ui-layer * {
            pointer-events: auto;
        }

        .center-hub {
            position: relative;
            width: 600px;
            height: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .title {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 24px;
            text-shadow: 0 4px 20px rgba(0, 150, 255, 0.4);
            background: linear-gradient(135deg, #7928CA, #4285F4, #00DFD8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-container {
            width: 380px;
            position: relative;
            z-index: 5;
        }

        .search-bar {
            width: 100%;
            padding: 16px 24px;
            font-size: 1.05rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            color: #ffffff;
            outline: none;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            text-align: center;
        }

        .search-bar::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-bar:focus {
            border-color: #4285F4;
            background: rgba(15, 23, 42, 0.85);
            box-shadow: 0 8px 32px 0 rgba(66, 133, 244, 0.4);
            text-align: left;
        }

        .add-btn {
            margin-top: 45px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            transition: all 0.2s ease;
            z-index: 5;
        }

        .add-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .circular-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .shortcut-item {
            position: absolute;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 76px;
            height: 76px;
            margin-left: -38px;
            margin-top: -38px;
            text-decoration: none;
            color: #ffffff;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .shortcut-item:hover {
            transform: scale(1.15) !important;
        }

        .shortcut-icon {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            backdrop-filter: blur(12px);
            transition: all 0.2s ease;
        }

        .shortcut-item:hover .shortcut-icon {
            background: rgba(66, 133, 244, 0.3);
            border-color: rgba(66, 133, 244, 0.6);
            box-shadow: 0 8px 30px rgba(66, 133, 244, 0.4);
        }

        .shortcut-label {
            font-size: 0.75rem;
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90px;
            margin-top: 6px;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #161b22;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 24px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .modal-content h3 {
            font-size: 1.1rem;
            color: #fff;
        }

        .modal-content input {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-save {
            background: #4285F4;
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="water-canvas"></canvas>
    </div>

    <div class="ui-layer">
        <div class="center-hub">
            <h1 class="title">The Royal Chromer</h1>

            <div class="search-container">
                <input type="text" id="search-input" class="search-bar" placeholder="Search Google or type a URL..." autofocus>
            </div>

            <button class="add-btn" id="open-modal-btn">+ Add Shortcut</button>

            <div class="circular-ring" id="shortcuts-container"></div>
        </div>
    </div>

    <div class="modal" id="add-modal">
        <div class="modal-content">
            <h3>Add New Shortcut</h3>
            <input type="text" id="shortcut-title" placeholder="Title (e.g. Google Earth)">
            <input type="text" id="shortcut-url" placeholder="URL (e.g. https://earth.google.com)">
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" id="close-modal-btn">Cancel</button>
                <button class="modal-btn btn-save" id="save-shortcut-btn">Save</button>
            </div>
        </div>
    </div>

    <script>
        // Stroberri-Style 2D Water Heightfield & Refraction Simulation
        const canvas = document.getElementById('water-canvas');
        const ctx = canvas.getContext('2d');

        let scale = 2; // Resolution downscaling for high performance wave calculation
        let width = Math.floor(window.innerWidth / scale);
        let height = Math.floor(window.innerHeight / scale);

        canvas.width = width;
        canvas.height = height;

        let buffer1 = new Float32Array(width * height);
        let buffer2 = new Float32Array(width * height);
        let imgData = ctx.createImageData(width, height);

        // Click Ripple Shockwaves Array
        const clickRings = [];

        window.addEventListener('resize', () => {
            width = Math.floor(window.innerWidth / scale);
            height = Math.floor(window.innerHeight / scale);
            canvas.width = width;
            canvas.height = height;
            buffer1 = new Float32Array(width * height);
            buffer2 = new Float32Array(width * height);
            imgData = ctx.createImageData(width, height);
        });

        // Water surface disturbance
        function disturbWater(x, y, strength, radius = 3) {
            const pad = 5;
            if (x < pad || x >= width - pad || y < pad || y >= height - pad) return;

            for (let j = -radius; j <= radius; j++) {
                for (let i = -radius; i <= radius; i++) {
                    const nx = x + i;
                    const ny = y + j;
                    if (nx >= pad && nx < width - pad && ny >= pad && ny < height - pad) {
                        buffer1[ny * width + nx] += strength;
                    }
                }
            }
        }

        let lastMouseX = null;
        let lastMouseY = null;

        window.addEventListener('mousemove', (e) => {
            const x = Math.floor(e.clientX / scale);
            const y = Math.floor(e.clientY / scale);

            if (lastMouseX !== null && lastMouseY !== null) {
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                const speed = Math.hypot(dx, dy);
                if (speed > 1) {
                    disturbWater(x, y, Math.min(speed * 8, 300), 2);
                }
            } else {
                disturbWater(x, y, 120, 2);
            }

            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        // Click Shockwave Circle Effect
        window.addEventListener('mousedown', (e) => {
            const x = Math.floor(e.clientX / scale);
            const y = Math.floor(e.clientY / scale);

            // Calculate distance to the furthest corner so the ring reaches the entire edge of the screen
            const maxRadius = Math.hypot(
                Math.max(e.clientX, window.innerWidth - e.clientX),
                Math.max(e.clientY, window.innerHeight - e.clientY)
            );

            // Strong physical shockwave impulse
            disturbWater(x, y, 600, 5);

            // Visual shockwave ring particle
            clickRings.push({
                x: e.clientX,
                y: e.clientY,
                radius: 4,
                maxRadius: maxRadius,
                alpha: 0.85
            });
        });

        function renderWaterSimulation() {
            const dampening = 0.968;
            const data = imgData.data;

            // 1. Water Physics Buffer Update
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    const index = y * width + x;

                    buffer2[index] = (
                        buffer1[index - 1] +
                        buffer1[index + 1] +
                        buffer1[index - width] +
                        buffer1[index + width]
                    ) / 2 - buffer2[index];

                    buffer2[index] *= dampening;

                    // Light Refraction & Shading Calculation
                    const xGrad = buffer2[index - 1] - buffer2[index + 1];
                    const yGrad = buffer2[index - width] - buffer2[index + width];

                    const pixelIdx = index * 4;
                    // Dark theme base (#06090e) with blue/cyan water highlights
                    const r = Math.min(255, Math.max(0, 6 + xGrad * 1.8));
                    const g = Math.min(255, Math.max(0, 9 + yGrad * 2.5));
                    const b = Math.min(255, Math.max(0, 18 + (xGrad + yGrad) * 3.5));

                    data[pixelIdx] = r;
                    data[pixelIdx + 1] = g;
                    data[pixelIdx + 2] = b;
                    data[pixelIdx + 3] = 255;
                }
            }

            // 2. Edge Dampening Guardrails (Absorb boundary wave reflections)
            for (let x = 0; x < width; x++) {
                buffer2[x] = 0;
                buffer2[(height - 1) * width + x] = 0;
            }
            for (let y = 0; y < height; y++) {
                buffer2[y * width] = 0;
                buffer2[y * width + (width - 1)] = 0;
            }

            // Swap Heightfield Buffers
            const temp = buffer1;
            buffer1 = buffer2;
            buffer2 = temp;

            // Render Refracted Water Heightfield
            ctx.putImageData(imgData, 0, 0);

            // 3. Render Expanding Click Shockwave Circles
            ctx.save();
            for (let i = clickRings.length - 1; i >= 0; i--) {
                const ring = clickRings[i];
                ring.radius += 8.5; // Slightly faster expansion speed
                
                // Scale fade out based on dynamic max radius so it stays visible all the way to the edges
                const progress = ring.radius / ring.maxRadius;
                ring.alpha = Math.max(0, 0.85 * (1 - progress));

                if (ring.alpha <= 0 || ring.radius >= ring.maxRadius) {
                    clickRings.splice(i, 1);
                    continue;
                }

                ctx.lineWidth = 2.5;
                ctx.strokeStyle = `rgba(0, 223, 216, ${ring.alpha})`;
                ctx.shadowColor = 'rgba(66, 133, 244, 0.8)';
                ctx.shadowBlur = 12;

                ctx.beginPath();
                ctx.arc(ring.x / scale, ring.y / scale, ring.radius / scale, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();

            requestAnimationFrame(renderWaterSimulation);
        }

        renderWaterSimulation();

        // Search Bar Logic
        const searchInput = document.getElementById('search-input');
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (query) {
                    if (query.startsWith('http://') || query.startsWith('https://')) {
                        window.location.href = query;
                    } else if (query.includes('.') && !query.includes(' ')) {
                        window.location.href = 'https://' + query;
                    } else {
                        window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                    }
                }
            }
        });

        // Shortcuts & Radial Layout Manager
        const defaultShortcuts = [
            { title: 'Google Earth', url: 'https://earth.google.com', icon: '🌎' },
            { title: 'YouTube', url: 'https://www.youtube.com', icon: '▶' },
            { title: 'GitHub', url: 'https://github.com', icon: '🐙' },
            { title: 'Wikipedia', url: 'https://www.wikipedia.org', icon: '📚' },
            { title: 'Discord', url: 'https://discord.com', icon: '💬' },
            { title: 'Twitch', url: 'https://www.twitch.tv', icon: '👾' },
            { title: 'Aternos', url: 'https://aternos.org', icon: '🎮' },
            { title: 'Chunkbase', url: 'https://www.chunkbase.com', icon: '🗺️' }
        ];

        function getShortcuts() {
            const saved = localStorage.getItem('royal_chromer_shortcuts');
            return saved ? JSON.parse(saved) : defaultShortcuts;
        }

        function saveShortcuts(shortcuts) {
            localStorage.setItem('royal_chromer_shortcuts', JSON.stringify(shortcuts));
        }

        function renderShortcuts() {
            const container = document.getElementById('shortcuts-container');
            container.innerHTML = '';
            const list = getShortcuts();
            const total = list.length;
            const radius = 230; // Ring radius from center hub
            const centerX = 300;
            const centerY = 300;

            list.forEach((item, index) => {
                const angle = (index / total) * (2 * Math.PI) - (Math.PI / 2);
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);

                const a = document.createElement('a');
                a.className = 'shortcut-item';
                a.href = item.url;
                a.style.left = `${x}px`;
                a.style.top = `${y}px`;
                a.innerHTML = `
                    <div class="shortcut-icon">${item.icon || '🌐'}</div>
                    <div class="shortcut-label">${item.title}</div>
                `;
                container.appendChild(a);
            });
        }

        renderShortcuts();

        // Modal Management
        const modal = document.getElementById('add-modal');
        const openBtn = document.getElementById('open-modal-btn');
        const closeBtn = document.getElementById('close-modal-btn');
        const saveBtn = document.getElementById('save-shortcut-btn');

        openBtn.addEventListener('click', () => modal.style.display = 'flex');
        closeBtn.addEventListener('click', () => modal.style.display = 'none');

        saveBtn.addEventListener('click', () => {
            const titleInput = document.getElementById('shortcut-title');
            const urlInput = document.getElementById('shortcut-url');

            const title = titleInput.value.trim();
            let url = urlInput.value.trim();

            if (title && url) {
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }

                const list = getShortcuts();
                list.push({ title, url, icon: '🔗' });
                saveShortcuts(list);
                renderShortcuts();

                titleInput.value = '';
                urlInput.value = '';
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
