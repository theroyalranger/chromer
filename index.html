    <script>
        // Interactive Fluid & Color Simulation
        const canvas = document.getElementById('water-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Grid resolution for fluid simulation
        const gridScale = 12;
        let cols = Math.floor(width / gridScale);
        let rows = Math.floor(height / gridScale);

        let grid = [];
        let prevGrid = [];

        function initGrid() {
            cols = Math.floor(width / gridScale);
            rows = Math.floor(height / gridScale);
            grid = new Array(cols).fill(0).map(() => new Array(rows).fill(0));
            prevGrid = new Array(cols).fill(0).map(() => new Array(rows).fill(0));
        }

        initGrid();

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initGrid();
        });

        // Fluid Color Particles
        class FluidParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.size = Math.random() * 24 + 16;
                this.color = color;
                this.life = 1.0;
                this.decay = Math.random() * 0.015 + 0.008;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.life -= this.decay;
            }

            draw() {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.life * 0.45;
                ctx.beginPath();
                const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                grad.addColorStop(0, this.color);
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let particles = [];
        const colors = [
            'rgba(66, 133, 244, 0.8)',  // Blue
            'rgba(121, 40, 202, 0.8)',  // Purple
            'rgba(0, 223, 216, 0.8)',   // Cyan
            'rgba(234, 67, 53, 0.7)'    // Red accent
        ];

        let mouseX = width / 2;
        let mouseY = height / 2;
        let lastMouseX = mouseX;
        let lastMouseY = mouseY;
        let colorIdx = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            const dx = mouseX - lastMouseX;
            const dy = mouseY - lastMouseY;
            const speed = Math.sqrt(dx * dx + dy * dy);

            // Inject wave energy into grid
            const gx = Math.floor(mouseX / gridScale);
            const gy = Math.floor(mouseY / gridScale);

            if (gx > 1 && gx < cols - 2 && gy > 1 && gy < rows - 2) {
                grid[gx][gy] += Math.min(speed * 12, 400);
                grid[gx + 1][gy] += Math.min(speed * 6, 200);
                grid[gx - 1][gy] += Math.min(speed * 6, 200);
                grid[gx][gy + 1] += Math.min(speed * 6, 200);
                grid[gx][gy - 1] += Math.min(speed * 6, 200);
            }

            // Spawn fluid color particles
            if (speed > 2) {
                colorIdx = (colorIdx + 1) % colors.length;
                const p = new FluidParticle(mouseX, mouseY, colors[colorIdx]);
                p.vx = dx * 0.15;
                p.vy = dy * 0.15;
                particles.push(p);

                if (particles.length > 80) particles.shift();
            }

            lastMouseX = mouseX;
            lastMouseY = mouseY;
        });

        // Water ripple propagation algorithm
        function updateWaterGrid() {
            for (let i = 1; i < cols - 1; i++) {
                for (let j = 1; j < rows - 1; j++) {
                    const current = (
                        prevGrid[i - 1][j] +
                        prevGrid[i + 1][j] +
                        prevGrid[i][j - 1] +
                        prevGrid[i][j + 1]
                    ) / 2 - grid[i][j];

                    grid[i][j] = current * 0.95; // Damping
                }
            }

            // Swap grids
            const temp = prevGrid;
            prevGrid = grid;
            grid = temp;
        }

        function renderFluid() {
            ctx.fillStyle = 'rgba(13, 17, 23, 0.25)';
            ctx.fillRect(0, 0, width, height);

            // Update & draw liquid particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Render water ripples
            updateWaterGrid();

            ctx.lineWidth = 1;
            for (let i = 1; i < cols - 1; i++) {
                for (let j = 1; j < rows - 1; j++) {
                    const val = grid[i][j];
                    if (Math.abs(val) > 0.5) {
                        const x = i * gridScale;
                        const y = j * gridScale;
                        const alpha = Math.min(Math.abs(val) / 200, 0.4);

                        ctx.strokeStyle = val > 0 
                            ? `rgba(66, 133, 244, ${alpha})` 
                            : `rgba(0, 223, 216, ${alpha})`;
                        ctx.beginPath();
                        ctx.arc(x, y, Math.min(Math.abs(val) * 0.08, gridScale * 1.5), 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(renderFluid);
        }

        renderFluid();
