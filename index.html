<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Royal Chromer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #06090e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            padding: 20px;
            pointer-events: none;
        }

        .ui-layer * {
            pointer-events: auto;
        }

        /* Top Left CPS & Performance Widget */
        .cps-card {
            position: fixed;
            top: 20px;
            left: 20px;
            transform: none;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            padding: 10px 16px;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            z-index: 10;
            pointer-events: auto;
        }

        .cps-stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .cps-val {
            font-size: 1.05rem;
            font-weight: 700;
            color: #38bdf8;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .cps-lbl {
            font-size: 0.65rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.5px;
        }

        .cps-divider {
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, 0.12);
        }

        /* Top Header: Clock, Date, Calendar */
        .top-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .clock-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 30px;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .clock-card:hover {
            background: rgba(15, 23, 42, 0.85);
            border-color: rgba(66, 133, 244, 0.5);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
        }

        /* Weather Button Header Widget */
        .weather-btn-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 30px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 0.9rem;
            font-weight: 600;
            color: #38bdf8;
            text-decoration: none;
        }

        .weather-btn-card:hover {
            background: rgba(15, 23, 42, 0.85);
            border-color: rgba(56, 189, 248, 0.6);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 36px rgba(56, 189, 248, 0.3);
        }

        /* Weather Button Header Widget */
        .weather-btn-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 30px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            font-weight: 600;
            color: #38bdf8;
            text-decoration: none;
        }

        .weather-btn-card:hover {
            background: rgba(15, 23, 42, 0.85);
            border-color: rgba(56, 189, 248, 0.6);
            transform: translateY(2px);
            box-shadow: 0 8px 32px rgba(56, 189, 248, 0.25);
        }

        .time-display {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        .date-display {
            font-size: 0.9rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            padding-left: 14px;
        }

        /* Calendar Popover */
        .calendar-popover {
            display: none;
            position: absolute;
            top: 55px;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            padding: 20px;
            width: 280px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            flex-direction: column;
            gap: 12px;
            z-index: 20;
        }

        .calendar-popover.active {
            display: flex;
        }

        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .cal-nav {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .cal-nav:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
            font-size: 0.8rem;
        }

        .cal-day-name {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 600;
            padding-bottom: 4px;
        }

        .cal-cell {
            padding: 6px 0;
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.8);
        }

        .cal-cell.today {
            background: #4285F4;
            color: #fff;
            font-weight: 700;
            box-shadow: 0 0 10px rgba(66, 133, 244, 0.6);
        }

        .cal-cell.has-event {
            position: relative;
            cursor: pointer;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        .cal-cell.has-custom-event {
            border-color: rgba(168, 85, 247, 0.6);
            background: rgba(168, 85, 247, 0.15);
        }

        .cal-cell.has-event::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 6px #38bdf8;
        }

        .cal-cell.has-custom-event::after {
            background: #a855f7;
            box-shadow: 0 0 6px #a855f7;
        }

        .cal-cell:not(.empty):hover {
            background: rgba(56, 189, 248, 0.25);
            cursor: pointer;
        }

        .event-tooltip {
            margin-top: 6px;
            padding: 10px 12px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            font-size: 0.78rem;
            color: #e0f2fe;
            display: none;
            flex-direction: column;
            gap: 6px;
            animation: fadeIn 0.2s ease-in-out;
        }

        .event-tooltip.active {
            display: flex;
        }

        .event-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .delete-event-btn {
            background: transparent;
            border: none;
            color: #f87171;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            padding: 0 4px;
            border-radius: 4px;
        }

        .delete-event-btn:hover {
            background: rgba(248, 113, 113, 0.2);
        }

        .event-title-text {
            font-weight: 700;
            color: #38bdf8;
        }

        .cal-hint {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.45);
            text-align: center;
            margin-top: 4px;
        }

        .cal-cell.empty {
            pointer-events: none;
        }

        /* Center Hub */
        .center-hub {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 60px;
        }

        .title {
            font-family: 'Pacifico', cursive;
            font-size: 3.8rem;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 24px;
            text-shadow: 0 4px 25px rgba(0, 150, 255, 0.5), 0 0 40px rgba(121, 40, 202, 0.3);
            background: linear-gradient(135deg, #a855f7, #38bdf8, #00dfd8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding: 0 10px;
        }

        .search-container {
            width: 420px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .search-bar {
            width: 100%;
            padding: 16px 24px;
            font-size: 1.05rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            color: #ffffff;
            outline: none;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            text-align: center;
        }

        .search-bar::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-bar:focus {
            border-color: #4285F4;
            background: rgba(15, 23, 42, 0.85);
            box-shadow: 0 8px 32px 0 rgba(66, 133, 244, 0.4);
            text-align: left;
        }

        /* Add Shortcut Button Under Search Bar */
        .add-shortcut-center-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(12px);
            border: 1px dashed rgba(255, 255, 255, 0.25);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .add-shortcut-center-btn:hover {
            background: rgba(15, 23, 42, 0.85);
            color: #ffffff;
            border-color: rgba(66, 133, 244, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(66, 133, 244, 0.3);
        }

        /* Edge Dock Sidebars */
        .edge-sidebar {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 16px 12px;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            z-index: 10;
        }

        .edge-sidebar.left {
            left: 20px;
        }

        .edge-sidebar.right {
            right: 20px;
        }

        .shortcut-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #ffffff;
            border-radius: 14px;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease;
            will-change: transform;
        }

        .shortcut-item:hover {
            transform: scale(1.15) translateY(-2px);
        }

        .shortcut-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            backdrop-filter: blur(8px);
            flex-shrink: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .shortcut-item:hover {
            transform: scale(1.08);
        }

        .shortcut-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            backdrop-filter: blur(8px);
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .shortcut-item:hover .shortcut-icon {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(66, 133, 244, 0.6);
            box-shadow: 0 0 12px rgba(66, 133, 244, 0.4);
        }

        .shortcut-label {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 500;
            color: #ffffff;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }

        .edge-sidebar.left .shortcut-label {
            left: calc(100% + 12px);
        }

        .edge-sidebar.right .shortcut-label {
            right: calc(100% + 12px);
        }

        .shortcut-item:hover .shortcut-label {
            opacity: 1;
            visibility: visible;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #161b22;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 24px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .modal-content h3 {
            font-size: 1.1rem;
            color: #fff;
        }

        .modal-content input {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-save {
            background: #4285F4;
            color: #fff;
        }

        /* Selected Day Text in Event Modal */
        .event-modal-date {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="water-canvas"></canvas>
    </div>

    <!-- Edge Dock Sidebars -->
    <div class="edge-sidebar left" id="sidebar-left"></div>
    <div class="edge-sidebar right" id="sidebar-right"></div>

    <!-- Left Side CPS, Performance & System Stats Widget -->
    <div class="cps-card">
        <div class="cps-stat-item">
            <span class="cps-val" id="cps-value">0.0</span>
            <span class="cps-lbl">CPS</span>
        </div>
        <div class="cps-divider"></div>
        <div class="cps-stat-item">
            <span class="cps-val" id="fps-value" style="color: #4ade80;">60</span>
            <span class="cps-lbl">FPS</span>
        </div>
        <div class="cps-divider"></div>
        <div class="cps-stat-item">
            <span class="cps-val" id="ping-value" style="color: #a855f7;">12ms</span>
            <span class="cps-lbl">PING</span>
        </div>
    </div>

    <!-- Notes Floating Drawer Button (Bottom Right) -->
    <button id="notes-toggle-btn" style="position: fixed; bottom: 20px; right: 20px; z-index: 10; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; width: 44px; height: 44px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; transition: all 0.2s;" title="Toggle Quick Notes">📝</button>

    <!-- Notes Drawer -->
    <div id="notes-drawer" style="display: none; position: fixed; bottom: 75px; right: 20px; z-index: 10; width: 280px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 20px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); flex-direction: column; gap: 10px;">
        <div style="font-weight: 600; font-size: 0.9rem; color: #38bdf8; display: flex; justify-content: space-between; align-items: center;">
            <span>⚡ Quick Scratchpad</span>
            <span style="font-size: 0.7rem; color: rgba(255,255,255,0.4);">Auto-saved</span>
        </div>
        <textarea id="quick-notes-area" style="width: 100%; height: 120px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; color: #fff; padding: 10px; font-family: inherit; font-size: 0.85rem; resize: none; outline: none;" placeholder="Jot down notes or quick to-dos..."></textarea>
    </div>

    <div class="ui-layer">
        <!-- Top Header with Date/Time & Calendar -->
        <div class="top-header">
            <div style="display: flex; gap: 12px; align-items: center;">
                <div class="clock-card" id="clock-card">
                    <span class="time-display" id="time-text">00:00:00</span>
                    <span class="date-display" id="date-text">Loading date...</span>
                </div>

                <a href="https://www.google.com/search?q=weather" target="_blank" class="weather-btn-card" id="weather-btn" title="Click to open Google Weather forecast & statistics">
                    <span id="weather-icon">☀️</span>
                    <span id="weather-temp">72°F</span>
                    <span style="font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-left: 2px;">Forecast ↗</span>
                </a>
            </div>

            <div class="calendar-popover" id="calendar-popover">
                <div class="cal-header">
                    <button class="cal-nav" id="cal-prev">‹</button>
                    <span id="cal-month-year">Month 2026</span>
                    <button class="cal-nav" id="cal-next">›</button>
                </div>
                <div class="cal-grid" id="cal-grid"></div>
                <div class="event-tooltip" id="event-tooltip">
                    <span class="event-title-text" id="event-tooltip-title">Holiday</span>
                    <div id="event-tooltip-list"></div>
                </div>
                <div class="cal-hint">💡 Click any day to add a custom event</div>
            </div>
        </div>

        <!-- Center Search Hub -->
        <div class="center-hub">
            <h1 class="title">The Royal Chromer</h1>
            <div class="search-container">
                <div style="display: flex; gap: 8px; margin-bottom: -6px;">
                    <button class="engine-btn active" data-engine="google" style="background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; cursor: pointer;">Google</button>
                    <button class="engine-btn" data-engine="ddg" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; cursor: pointer;">DuckDuckGo</button>
                    <button class="engine-btn" data-engine="youtube" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; cursor: pointer;">YouTube</button>
                </div>
                <input type="text" id="search-input" class="search-bar" placeholder="Search Google or type a URL..." autofocus>
                <button class="add-shortcut-center-btn" id="open-add-modal-btn">
                    <span>+</span> Add Shortcut
                </button>
            </div>
        </div>

        <div></div> <!-- Spacer -->
    </div>

    <!-- Modal for Adding Custom Calendar Event -->
    <div class="modal" id="event-modal">
        <div class="modal-content">
            <h3>Add Calendar Event</h3>
            <div class="event-modal-date" id="event-modal-date-text">Date</div>
            <input type="text" id="event-title-input" placeholder="Event title (e.g. Birthday Party)">
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" id="close-event-modal-btn">Cancel</button>
                <button class="modal-btn btn-save" id="save-event-btn">Save Event</button>
            </div>
        </div>
    </div>

    <!-- Modal for Adding Shortcuts -->
    <div class="modal" id="add-modal">
        <div class="modal-content">
            <h3>Add New Shortcut</h3>
            <input type="text" id="shortcut-title" placeholder="Title (e.g. Google Earth)">
            <input type="text" id="shortcut-url" placeholder="URL (e.g. https://earth.google.com)">
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" id="close-modal-btn">Cancel</button>
                <button class="modal-btn btn-save" id="save-shortcut-btn">Save</button>
            </div>
        </div>
    </div>

    <script>
        // Aurora 2D Water Simulation Engine
        const canvas = document.getElementById('water-canvas');
        const ctx = canvas.getContext('2d');

        let scale = 2; 
        const marginOffset = 256; // Massive off-screen padding so waves extend far beyond the display
        let width = Math.max(1, Math.floor((window.innerWidth || 800) / scale));
        let height = Math.max(1, Math.floor((window.innerHeight || 600) / scale));

        // Extended grid dimensions so wave equations run past visible bounds
        let simWidth = width + marginOffset * 2;
        let simHeight = height + marginOffset * 2;

        canvas.width = width;
        canvas.height = height;

        let buffer1 = new Float32Array(simWidth * simHeight);
        let buffer2 = new Float32Array(simWidth * simHeight);
        let imgData = ctx.createImageData(width, height);

        const clickRings = [];
        let auroraPhase = 0;

        function resizeCanvas() {
            const w = Math.max(1, Math.floor(window.innerWidth / scale));
            const h = Math.max(1, Math.floor(window.innerHeight / scale));
            
            if (w === width && h === height) return;
            
            width = w;
            height = h;
            simWidth = width + marginOffset * 2;
            simHeight = height + marginOffset * 2;

            canvas.width = width;
            canvas.height = height;
            buffer1 = new Float32Array(simWidth * simHeight);
            buffer2 = new Float32Array(simWidth * simHeight);
            imgData = ctx.createImageData(width, height);
        }

        window.addEventListener('resize', resizeCanvas);

        function disturbWater(x, y, strength, radius = 3) {
            // Translate visible canvas coordinates into extended simulation grid space
            const simX = x + marginOffset;
            const simY = y + marginOffset;

            for (let j = -radius; j <= radius; j++) {
                for (let i = -radius; i <= radius; i++) {
                    const distSq = i * i + j * j;
                    if (distSq <= radius * radius) {
                        const nx = simX + i;
                        const ny = simY + j;
                        if (nx >= 1 && nx < simWidth - 1 && ny >= 1 && ny < simHeight - 1) {
                            const falloff = 1 - Math.sqrt(distSq) / (radius + 1);
                            buffer1[ny * simWidth + nx] += strength * falloff;
                        }
                    }
                }
            }
        }

        let lastMouseX = null;
        let lastMouseY = null;

        // CPS & FPS Counter Logic
        const clickTimestamps = [];
        const cpsDisplay = document.getElementById('cps-value');
        const fpsDisplay = document.getElementById('fps-value');

        // FPS Calculation Variables
        let frameCount = 0;
        let lastFpsTime = performance.now();

        function updateCPS() {
            const now = Date.now();
            while (clickTimestamps.length > 0 && clickTimestamps[0] <= now - 1000) {
                clickTimestamps.shift();
            }
            cpsDisplay.textContent = clickTimestamps.length.toFixed(1);
        }

        setInterval(updateCPS, 50);

        window.addEventListener('mousemove', (e) => {
            if (e.target.closest('.ui-layer, .edge-sidebar, .cps-card, .modal, .calendar-popover, #notes-drawer, #notes-toggle-btn')) {
                lastMouseX = null;
                lastMouseY = null;
                return;
            }

            if (lastMouseX !== null && lastMouseY !== null) {
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                const dist = Math.hypot(dx, dy);

                if (dist > 1) {
                    const steps = Math.min(Math.floor(dist / 2), 16);
                    for (let i = 0; i <= steps; i++) {
                        const interpX = Math.floor((lastMouseX + (dx * i) / Math.max(1, steps)) / scale);
                        const interpY = Math.floor((lastMouseY + (dy * i) / Math.max(1, steps)) / scale);
                        disturbWater(interpX, interpY, 280, 2);
                    }
                }
            } else {
                disturbWater(Math.floor(e.clientX / scale), Math.floor(e.clientY / scale), 280, 2);
            }

            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        // Search Engine State
        let currentEngine = 'google';
        const searchInput = document.getElementById('search-input');

        document.querySelectorAll('.engine-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.engine-btn').forEach(b => {
                    b.style.background = 'rgba(255,255,255,0.05)';
                    b.style.color = 'rgba(255,255,255,0.6)';
                    b.style.borderColor = 'rgba(255,255,255,0.1)';
                });
                btn.style.background = 'rgba(255,255,255,0.15)';
                btn.style.color = '#fff';
                btn.style.borderColor = 'rgba(255,255,255,0.2)';
                currentEngine = btn.dataset.engine;
                searchInput.placeholder = `Search ${btn.textContent} or type a URL...`;
            });
        });

        // Quick Notes Drawer Logic
        const notesBtn = document.getElementById('notes-toggle-btn');
        const notesDrawer = document.getElementById('notes-drawer');
        const notesArea = document.getElementById('quick-notes-area');

        notesBtn.addEventListener('click', () => {
            notesDrawer.style.display = notesDrawer.style.display === 'flex' ? 'none' : 'flex';
        });

        notesArea.value = localStorage.getItem('royal_chromer_quick_notes') || '';
        notesArea.addEventListener('input', () => {
            localStorage.setItem('royal_chromer_quick_notes', notesArea.value);
        });

        window.addEventListener('mousedown', (e) => {
            // Disable effect when clicking on interactive UI elements
            if (e.target.closest('.ui-layer, .edge-sidebar, .cps-card, .modal, .calendar-popover, #notes-drawer, #notes-toggle-btn')) {
                return;
            }

            // Track click for CPS calculation
            clickTimestamps.push(Date.now());
            updateCPS();

            // Calculate max radius so the ring touches all edges of the screen
            const maxRadius = Math.hypot(
                Math.max(e.clientX, window.innerWidth - e.clientX),
                Math.max(e.clientY, window.innerHeight - e.clientY)
            );

            // Single expanding blue-green circle
            clickRings.push({
                x: e.clientX,
                y: e.clientY,
                radius: 4,
                maxRadius: maxRadius,
                hue: Math.floor(Math.random() * 20 + 165), // Vibrant blue-green / cyan spectrum
                energy: 1.0,
                fadeSpeed: 1.0,
                bouncedRings: new Set()
            });
        });

        function renderWaterSimulation() {
            const iterations = 2;
            const dampening = 0.92; // Stronger dampening causes water waves to dissipate extremely quickly

            auroraPhase += 0.015;

            for (let iter = 0; iter < iterations; iter++) {
                // Wave Differential Equation Solver on extended grid
                for (let y = 1; y < simHeight - 1; y++) {
                    for (let x = 1; x < simWidth - 1; x++) {
                        const index = y * simWidth + x;

                        let wave = (
                            buffer1[index - 1] +
                            buffer1[index + 1] +
                            buffer1[index - simWidth] +
                            buffer1[index + simWidth]
                        ) / 2 - buffer2[index];

                        wave *= dampening;
                        buffer2[index] = wave;
                    }
                }

                // Seamless Passthrough Border Conditions at far outer boundary
                for (let x = 0; x < simWidth; x++) {
                    buffer2[x] = buffer2[simWidth + x] * 0.96;
                    buffer2[(simHeight - 1) * simWidth + x] = buffer2[(simHeight - 2) * simWidth + x] * 0.96;
                }
                for (let y = 0; y < simHeight; y++) {
                    buffer2[y * simWidth] = buffer2[y * simWidth + 1] * 0.96;
                    buffer2[y * simWidth + (simWidth - 1)] = buffer2[y * simWidth + (simWidth - 2)] * 0.96;
                }

                const temp = buffer1;
                buffer1 = buffer2;
                buffer2 = temp;
            }

            const data = imgData.data;

            // Render Shading & Aurora Color Phase for visible viewport pixels only
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const simX = x + marginOffset;
                    const simY = y + marginOffset;
                    const index = simY * simWidth + simX;

                    const xGrad = buffer1[index - 1] - buffer1[index + 1];
                    const yGrad = buffer1[index - simWidth] - buffer1[index + simWidth];

                    const val = xGrad + yGrad;
                    const pixelIdx = (y * width + x) * 4;

                    if (Math.abs(val) > 0.05) {
                        const waveFactor = Math.sin(auroraPhase + (x + y) * 0.02);
                        const r = Math.min(255, Math.max(0, 6 + val * (1.2 + waveFactor * 0.5)));
                        const g = Math.min(255, Math.max(0, 15 + val * (2.8 + waveFactor * 1.2)));
                        const b = Math.min(255, Math.max(0, 30 + val * (4.0 - waveFactor * 1.0)));

                        data[pixelIdx] = r;
                        data[pixelIdx + 1] = g;
                        data[pixelIdx + 2] = b;
                        data[pixelIdx + 3] = 255;
                    } else {
                        data[pixelIdx] = 6;
                        data[pixelIdx + 1] = 9;
                        data[pixelIdx + 2] = 14;
                        data[pixelIdx + 3] = 255;
                    }
                }
            }

            ctx.putImageData(imgData, 0, 0);

            // FPS Calculation Loop
            frameCount++;
            const nowTime = performance.now();
            if (nowTime - lastFpsTime >= 1000) {
                const currentFps = Math.round((frameCount * 1000) / (nowTime - lastFpsTime));
                fpsDisplay.textContent = currentFps;
                frameCount = 0;
                lastFpsTime = nowTime;
            }

            // Wave-on-Wave Bounce Detection Logic
            for (let i = 0; i < clickRings.length; i++) {
                for (let j = i + 1; j < clickRings.length; j++) {
                    const ringA = clickRings[i];
                    const ringB = clickRings[j];

                    const dx = ringB.x - ringA.x;
                    const dy = ringB.y - ringA.y;
                    const centerDist = Math.hypot(dx, dy);

                    // Check if wavefront circles are colliding/intersecting
                    const combinedRadius = ringA.radius + ringB.radius;
                    const radiusDiff = Math.abs(ringA.radius - ringB.radius);

                    if (centerDist <= combinedRadius && centerDist >= radiusDiff) {
                        if (!ringA.bouncedRings.has(ringB) && !ringB.bouncedRings.has(ringA)) {
                            ringA.bouncedRings.add(ringB);
                            ringB.bouncedRings.add(ringA);

                            // Increase decay/fade speed after bouncing off another wave
                            ringA.fadeSpeed *= 1.85;
                            ringB.fadeSpeed *= 1.85;

                            // Dampen total wave energy on collision bounce
                            ringA.energy *= 0.75;
                            ringB.energy *= 0.75;

                            // Fluid displacement interference pulse at collision center
                            const midX = Math.floor((ringA.x + ringB.x) / (2 * scale));
                            const midY = Math.floor((ringA.y + ringB.y) / (2 * scale));
                            disturbWater(midX, midY, 320, 3);
                        }
                    }
                }
            }

            // Expanding Shockwave Circles on Click (Smooth Overlap Blending)
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            
            for (let i = clickRings.length - 1; i >= 0; i--) {
                const ring = clickRings[i];
                
                const remainingProgress = Math.max(0, 1 - (ring.radius / ring.maxRadius));
                const currentSpeed = (8.0 + (18.0 * remainingProgress));
                ring.radius += currentSpeed;

                const progress = ring.radius / ring.maxRadius;
                const alpha = Math.max(0, 0.85 * (1 - progress));

                if (alpha <= 0.01 || ring.radius >= ring.maxRadius) {
                    clickRings.splice(i, 1);
                    continue;
                }

                ctx.lineWidth = Math.max(1.5, 3.5 * (1 - progress * 0.5));
                ctx.strokeStyle = `hsla(${ring.hue}, 95%, 55%, ${alpha})`;
                ctx.shadowColor = `hsla(${ring.hue}, 100%, 50%, ${alpha * 0.9})`;
                ctx.shadowBlur = 14;

                ctx.beginPath();
                ctx.arc(ring.x / scale, ring.y / scale, ring.radius / scale, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();

            requestAnimationFrame(renderWaterSimulation);
        }

        renderWaterSimulation();

        // Clock & Date Updates
        function updateClockAndDate() {
            const now = new Date();
            
            // Time string format (HH:MM:SS)
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('time-text').textContent = `${hours}:${minutes}:${seconds}`;

            // Date string format
            const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('date-text').textContent = now.toLocaleDateString('en-US', options);
        }

        setInterval(updateClockAndDate, 1000);
        updateClockAndDate();

        // Holiday Engine Helper
        function getHolidayForDate(year, month, day) {
            // Month is 0-indexed (0 = Jan, 11 = Dec)
            if (month === 0 && day === 1) return "🎉 New Year's Day";
            if (month === 1 && day === 14) return "❤️ Valentine's Day";
            if (month === 2 && day === 17) return "☘️ St. Patrick's Day";
            if (month === 6 && day === 4) return "🎆 Independence Day";
            if (month === 9 && day === 31) return "🎃 Halloween";
            if (month === 10 && day === 11) return "🎖️ Veterans Day";
            if (month === 11 && day === 24) return "🎄 Christmas Eve";
            if (month === 11 && day === 25) return "🎁 Christmas Day";
            if (month === 11 && day === 31) return "🥳 New Year's Eve";
            return null;
        }

        // Calendar State Initialization
        let currCalDate = new Date();
        let selectedEventDate = null; // { year, month, day }

        // Custom Local Storage Events Manager
        function getCustomEvents() {
            const saved = localStorage.getItem('royal_chromer_shortcuts');
            return saved ? JSON.parse(saved) : defaultShortcuts;
        }

        // Custom Local Storage Events Manager
        function getCustomEventsData() {
            const saved = localStorage.getItem('royal_chromer_events');
            return saved ? JSON.parse(saved) : {};
        }

        function saveCustomEventsData(events) {
            localStorage.setItem('royal_chromer_events', JSON.stringify(events));
        }

        function addCustomEvent(year, month, day, text) {
            const events = getCustomEventsData();
            const key = `${year}-${month}-${day}`;
            if (!events[key]) events[key] = [];
            events[key].push(text);
            saveCustomEventsData(events);
            renderCalendar();
        }

        function removeCustomEvent(year, month, day, index) {
            const events = getCustomEventsData();
            const key = `${year}-${month}-${day}`;
            if (events[key]) {
                events[key].splice(index, 1);
                if (events[key].length === 0) delete events[key];
                saveCustomEventsData(events);
                renderCalendar();
            }
        }

        // Event Modal Controls
        const eventModal = document.getElementById('event-modal');
        const eventTitleInput = document.getElementById('event-title-input');
        const closeEventModalBtn = document.getElementById('close-event-modal-btn');
        const saveEventBtn = document.getElementById('save-event-btn');

        closeEventModalBtn.addEventListener('click', () => {
            eventModal.style.display = 'none';
        });

        saveEventBtn.addEventListener('click', () => {
            const text = eventTitleInput.value.trim();
            if (text && selectedEventDate) {
                addCustomEvent(selectedEventDate.year, selectedEventDate.month, selectedEventDate.day, text);
                eventTitleInput.value = '';
                eventModal.style.display = 'none';
            }
        });

        function renderCalendar() {
            const year = currCalDate.getFullYear();
            const month = currCalDate.getMonth();

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('cal-month-year').textContent = `${monthNames[month]} ${year}`;

            const grid = document.getElementById('cal-grid');
            grid.innerHTML = '';
            const tooltip = document.getElementById('event-tooltip');
            tooltip.classList.remove('active');

            const dayNames = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
            dayNames.forEach(d => {
                const el = document.createElement('div');
                el.className = 'cal-day-name';
                el.textContent = d;
                grid.appendChild(el);
            });

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            const customEventsMap = getCustomEventsData();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'cal-cell empty';
                grid.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                cell.className = 'cal-cell';
                cell.textContent = day;

                if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    cell.classList.add('today');
                }

                const holidayName = getHolidayForDate(year, month, day);
                const eventKey = `${year}-${month}-${day}`;
                const userEvents = customEventsMap[eventKey] || [];

                if (holidayName || userEvents.length > 0) {
                    cell.classList.add('has-event');
                    if (userEvents.length > 0) {
                        cell.classList.add('has-custom-event');
                    }

                    cell.addEventListener('mouseenter', () => {
                        document.getElementById('event-tooltip-title').textContent = `${monthNames[month]} ${day}, ${year}`;
                        const listContainer = document.getElementById('event-tooltip-list');
                        listContainer.innerHTML = '';

                        if (holidayName) {
                            const holEl = document.createElement('div');
                            holEl.className = 'event-item';
                            holEl.textContent = holidayName;
                            listContainer.appendChild(holEl);
                        }

                        userEvents.forEach((evText, idx) => {
                            const evEl = document.createElement('div');
                            evEl.className = 'event-item';
                            evEl.innerHTML = `
                                <span>📌 ${evText}</span>
                                <button class="delete-event-btn" title="Delete Event">×</button>
                            `;
                            evEl.querySelector('.delete-event-btn').addEventListener('click', (e) => {
                                e.stopPropagation();
                                removeCustomEvent(year, month, day, idx);
                            });
                            listContainer.appendChild(evEl);
                        });

                        tooltip.classList.add('active');
                    });
                }

                // Click to open custom event modal
                cell.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectedEventDate = { year, month, day };
                    document.getElementById('event-modal-date-text').textContent = `${monthNames[month]} ${day}, ${year}`;
                    eventTitleInput.value = '';
                    eventModal.style.display = 'flex';
                    eventTitleInput.focus();
                });

                grid.appendChild(cell);
            }
        }

        const clockCard = document.getElementById('clock-card');
        const calPopover = document.getElementById('calendar-popover');

        clockCard.addEventListener('click', () => {
            calPopover.classList.toggle('active');
            if (calPopover.classList.contains('active')) {
                renderCalendar();
            }
        });

        document.getElementById('cal-prev').addEventListener('click', (e) => {
            e.stopPropagation();
            currCalDate.setMonth(currCalDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('cal-next').addEventListener('click', (e) => {
            e.stopPropagation();
            currCalDate.setMonth(currCalDate.getMonth() + 1);
            renderCalendar();
        });

        // Shortcuts & Edge Dock Manager
        const defaultShortcuts = [
            { title: 'Google Earth', url: 'https://earth.google.com', icon: '🌎' },
            { title: 'YouTube', url: 'https://www.youtube.com', icon: '▶' },
            { title: 'GitHub', url: 'https://github.com', icon: '🐙' },
            { title: 'Wikipedia', url: 'https://www.wikipedia.org', icon: '📚' },
            { title: 'Discord', url: 'https://discord.com', icon: '💬' },
            { title: 'Twitch', url: 'https://www.twitch.tv', icon: '👾' },
            { title: 'Aternos', url: 'https://aternos.org', icon: '🎮' },
            { title: 'Chunkbase', url: 'https://www.chunkbase.com', icon: '🗺️' }
        ];

        function getShortcuts() {
            const saved = localStorage.getItem('royal_chromer_shortcuts');
            return saved ? JSON.parse(saved) : defaultShortcuts;
        }

        function saveShortcuts(shortcuts) {
            localStorage.setItem('royal_chromer_shortcuts', JSON.stringify(shortcuts));
        }

        function renderShortcuts() {
            const leftSidebar = document.getElementById('sidebar-left');
            const rightSidebar = document.getElementById('sidebar-right');

            leftSidebar.innerHTML = '';
            rightSidebar.innerHTML = '';

            const list = getShortcuts();
            const half = Math.ceil(list.length / 2);

            const leftList = list.slice(0, half);
            const rightList = list.slice(half);

            leftList.forEach(item => {
                const a = document.createElement('a');
                a.className = 'shortcut-item';
                a.href = item.url;
                a.innerHTML = `
                    <div class="shortcut-icon">${item.icon || '🌐'}</div>
                    <span class="shortcut-label">${item.title}</span>
                `;
                leftSidebar.appendChild(a);
            });

            rightList.forEach(item => {
                const a = document.createElement('a');
                a.className = 'shortcut-item';
                a.href = item.url;
                a.innerHTML = `
                    <div class="shortcut-icon">${item.icon || '🌐'}</div>
                    <span class="shortcut-label">${item.title}</span>
                `;
                rightSidebar.appendChild(a);
            });
        }

        renderShortcuts();

        // Modal Management
        const modal = document.getElementById('add-modal');
        const openBtn = document.getElementById('open-add-modal-btn');
        const closeBtn = document.getElementById('close-modal-btn');
        const saveBtn = document.getElementById('save-shortcut-btn');

        openBtn.addEventListener('click', () => modal.style.display = 'flex');
        closeBtn.addEventListener('click', () => modal.style.display = 'none');

        saveBtn.addEventListener('click', () => {
            const titleInput = document.getElementById('shortcut-title');
            const urlInput = document.getElementById('shortcut-url');

            const title = titleInput.value.trim();
            let url = urlInput.value.trim();

            if (title && url) {
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }

                const list = getShortcuts();
                list.push({ title, url, icon: '🔗' });
                saveShortcuts(list);
                renderShortcuts();

                titleInput.value = '';
                urlInput.value = '';
                modal.style.display = 'none';
            }
        });
    </script>
</body>
