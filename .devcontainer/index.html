<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Royal Chromer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000000;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    /* Radial torch effect following cursor */
    .glow-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(circle 250px at var(--x, 50%) var(--y, 50%), rgba(0, 162, 255, 0.4), transparent 80%);
      transition: background 0.05s ease-out;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      z-index: 1;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      z-index: 1;
      max-width: 600px;
    }

    .btn {
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      backdrop-filter: blur(5px);
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="glow-bg" id="glow"></div>

  <h1>The Royal Chromer</h1>

  <div class="links-grid">
    <a class="btn" href="https://youtube.com" target="_blank">YouTube</a>
    <a class="btn" href="https://aternos.org" target="_blank">Aternos</a>
    <a class="btn" href="https://chunkbase.com" target="_blank">Chunkbase</a>
    <a class="btn" href="https://chat.google.com" target="_blank">Google Chat</a>
    <a class="btn" href="https://meet.google.com" target="_blank">Google Meet</a>
  </div>

  <script>
    const glow = document.getElementById('glow');
    window.addEventListener('mousemove', (e) => {
      glow.style.setProperty('--x', `${e.clientX}px`);
      glow.style.setProperty('--y', `${e.clientY}px`);
    });
  </script>
</body>
</html>
